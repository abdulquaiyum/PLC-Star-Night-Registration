<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome - PLC Star Night '26</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
      --card-bg: rgba(22, 27, 34, 0.85);
      --accent-gold: #f1c40f;
      --text-main: #ffffff;
      --text-sub: #8b949e;
      --border-color: rgba(241, 196, 15, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      overflow: hidden;
    }

    .container {
      max-width: 900px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 50px 30px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 30px rgba(241, 196, 15, 0.15);
      backdrop-filter: blur(10px);
      animation: fadeIn 0.8s ease-in-out;
    }

    .event-title {
      font-size: 1.5rem;
      letter-spacing: 3px;
      color: var(--accent-gold);
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .welcome-label {
      font-size: 2.5rem;
      font-weight: 300;
      margin-bottom: 10px;
      color: var(--text-sub);
    }

    .guest-name {
      font-size: 3.8rem;
      font-weight: 700;
      color: #ffffff;
      margin: 20px 0;
      line-height: 1.2;
      word-wrap: break-word;
      min-height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }

    .details-box {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .detail-item {
      font-size: 1.2rem;
      color: var(--text-sub);
    }

    .detail-item span {
      color: var(--accent-gold);
      font-weight: 600;
    }

    .pulse-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      background-color: #2ea44f;
      border-radius: 50%;
      margin-right: 8px;
      box-shadow: 0 0 8px #2ea44f;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(46, 164, 79, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(46, 164, 79, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(46, 164, 79, 0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="event-title">PLC Star Night '26</div>
    <div class="welcome-label">WELCOME</div>
    
    <div id="guestName" class="guest-name">Waiting for guest...</div>

    <div class="details-box">
      <div class="detail-item"><span class="pulse-dot"></span>Live Updates</div>
      <div id="timeContainer" class="detail-item" style="display: none;">Time: <span id="checkInTime">--</span></div>
      <div id="tokenContainer" class="detail-item" style="display: none;">Token #: <span id="tokenNo">--</span></div>
    </div>
  </div>

  <script>
    // PRE-CONFIGURED WITH YOUR APPS SCRIPT URL
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyI-rC7SHYa4X0820Nif9hCl4vFchTYw_hla6ocaqiUn3ca3jjACNROoAa-FQGiBkua/exec";

    let lastTime = "";
    let lastName = "";

    function fetchLatestCheckIn() {
      const callbackName = 'jsonp_welcome_' + Math.round(100000 * Math.random());
      const script = document.createElement('script');

      window[callbackName] = function(data) {
        delete window[callbackName];
        if (script.parentNode) script.parentNode.removeChild(script);

        if (data && data.status !== "none" && data.name) {
          if (data.name !== lastName || data.time !== lastTime) {
            lastName = data.name;
            lastTime = data.time;

            const nameEl = document.getElementById("guestName");
            nameEl.style.animation = 'none';
            nameEl.offsetHeight; // Reflow
            nameEl.style.animation = 'fadeIn 0.5s ease-in-out';
            nameEl.innerText = data.name;

            if (data.time) {
              document.getElementById("checkInTime").innerText = data.time;
              document.getElementById("timeContainer").style.display = "block";
            }

            if (data.tokenNo) {
              document.getElementById("tokenNo").innerText = data.tokenNo;
              document.getElementById("tokenContainer").style.display = "block";
            }
          }
        }
      };

      script.src = `${SCRIPT_URL}?mode=latest&callback=${callbackName}`;
      script.onerror = function() {
        delete window[callbackName];
        if (script.parentNode) script.parentNode.removeChild(script);
      };

      document.body.appendChild(script);
    }

    // Poll for updates every 3 seconds
    setInterval(fetchLatestCheckIn, 3000);
    fetchLatestCheckIn();
  </script>

</body>
</html>
