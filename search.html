<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PLC Star Night - Check-In</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; background: #f4f6f9; color: #333; }
    .card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); max-width: 600px; margin: 0 auto 20px; }
    h2 { margin-bottom: 15px; color: #110826; }
    input[type="text"], input[type="number"] { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; }
    button { width: 100%; padding: 12px; background: #2a115c; color: #fff; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; }
    button:hover { background: #3c1a80; }
    .result-item { border-bottom: 1px solid #eee; padding: 15px 0; display: flex; justify-content: space-between; align-items: center; }
    .result-item:last-child { border-bottom: none; }
    .guest-info { font-size: 15px; }
    .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
    .badge-pending { background: #fff3cd; color: #856404; }
    .badge-checked { background: #d4edda; color: #155724; }
    .checkin-btn { width: auto; padding: 8px 16px; background: #28a745; margin-left: 10px; }
    .checkin-btn:hover { background: #218838; }
    .token-input { width: 100px !important; margin-bottom: 0 !important; display: inline-block; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Event Check-In</h2>
    <input type="text" id="searchInput" placeholder="Enter Name, EMP No, or Invitee ID..." onkeyup="if(event.key==='Enter') performSearch()">
    <button onclick="performSearch()">Search Guest</button>
  </div>

  <div class="card" id="resultsCard" style="display:none;">
    <h2>Search Results</h2>
    <div id="resultsContainer"></div>
  </div>

  <script>
    var BACKEND_URL = 'https://script.google.com/macros/s/AKfycbyI-rC7SHYa4X0820Nif9hCl4vFchTYw_hla6ocaqiUn3ca3jjACNROoAa-FQGiBkua/exec';

    function performSearch() {
      var query = document.getElementById('searchInput').value.trim();
      if (!query) return;

      var callbackName = 'search_cb_' + Math.round(Math.random() * 1000000);
      window[callbackName] = function(data) {
        delete window[callbackName];
        if (script.parentNode) script.parentNode.removeChild(script);
        renderResults(data);
      };

      var script = document.createElement('script');
      script.src = BACKEND_URL + '?mode=search&query=' + encodeURIComponent(query) + '&callback=' + callbackName;
      document.body.appendChild(script);
    }

    function renderResults(data) {
      var card = document.getElementById('resultsCard');
      var container = document.getElementById('resultsContainer');
      container.innerHTML = '';
      card.style.display = 'block';

      if (!data.matches || data.matches.length === 0) {
        container.innerHTML = '<p>No matching guests found.</p>';
        return;
      }

      data.matches.forEach(function(guest) {
        var isChecked = guest.status === 'Checked-In';
        var item = document.createElement('div');
        item.className = 'result-item';

        var statusBadge = isChecked 
          ? '<span class="badge badge-checked">Checked-In (Token: ' + (guest.tokenNo || 'N/A') + ')</span>'
          : '<span class="badge badge-pending">Pending</span>';

        var actionArea = isChecked ? '' : 
          '<div>' +
            '<input type="number" id="token_' + guest.rowIndex + '" class="token-input" min="1" max="530" placeholder="Token #"> ' +
            '<button class="checkin-btn" onclick="executeCheckIn(' + guest.rowIndex + ')">Check-In</button>' +
          '</div>';

        item.innerHTML = 
          '<div class="guest-info">' +
            '<strong>' + guest.name + '</strong><br>' +
            'EMP: ' + guest.empNo + ' | ID: ' + guest.inviteeId + '<br>' +
            statusBadge +
          '</div>' + actionArea;

        container.appendChild(item);
      });
    }

    function executeCheckIn(rowIndex) {
      var tokenInput = document.getElementById('token_' + rowIndex);
      var tokenVal = tokenInput ? tokenInput.value.trim() : '';

      if (!tokenVal) {
        alert('Please enter a Voting Token # (1 - 530) before checking in.');
        return;
      }

      var callbackName = 'checkin_cb_' + Math.round(Math.random() * 1000000);
      window[callbackName] = function(data) {
        delete window[callbackName];
        if (script.parentNode) script.parentNode.removeChild(script);

        if (data.status === 'success') {
          alert('Checked in ' + data.name + ' with Token #' + data.tokenNo);
          performSearch(); // Refresh search list
        } else {
          alert('Error: ' + data.message);
        }
      };

      var script = document.createElement('script');
      script.src = BACKEND_URL + '?mode=checkin&id=' + rowIndex + '&tokenNo=' + encodeURIComponent(tokenVal) + '&callback=' + callbackName;
      document.body.appendChild(script);
    }
  </script>
</body>
</html>
