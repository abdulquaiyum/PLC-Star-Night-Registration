<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check-In Station - PLC Star Night '26</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    :root {
      --bg-purple: linear-gradient(135deg, #1b022d 0%, #2e0854 50%, #120024 100%);
      --accent-gold: #f1c40f;
      --gold-gradient: linear-gradient(135deg, #ffe066 0%, #f1c40f 50%, #b38600 100%);
      --text-white: #ffffff;
      --card-purple: rgba(46, 8, 84, 0.6);
      --border-gold: rgba(241, 196, 15, 0.3);
      --success-green: #2ecc71;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    body {
      background: var(--bg-purple);
      color: var(--text-white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      font-size: 2rem;
      color: var(--accent-gold);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .header p {
      color: #d1b3ff;
      font-size: 0.95rem;
      margin-top: 4px;
    }

    .container {
      max-width: 650px;
      width: 100%;
      background: var(--card-purple);
      border: 1px solid var(--border-gold);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6);
      backdrop-filter: blur(12px);
    }

    .scanner-wrapper {
      position: relative;
      width: 100%;
      border-radius: 14px;
      overflow: hidden;
      border: 1.5px solid var(--border-gold);
      background: #000;
      margin-bottom: 24px;
    }

    #reader {
      width: 100%;
    }

    /* Hide default camera select dropdowns and buttons */
    #reader__dashboard, 
    #reader__status_span, 
    #reader__camera_selection,
    #reader button {
      display: none !important;
    }

    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .search-input {
      flex: 1;
      padding: 14px 18px;
      border-radius: 10px;
      border: 1px solid var(--border-gold);
      background: rgba(18, 0, 36, 0.7);
      color: var(--text-white);
      font-size: 1rem;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--accent-gold);
      box-shadow: 0 0 10px rgba(241, 196, 15, 0.3);
    }

    .btn {
      padding: 14px 24px;
      border-radius: 10px;
      border: none;
      background: var(--gold-gradient);
      color: #1b022d;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .results-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .guest-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(241, 196, 15, 0.2);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .guest-info h3 {
      font-size: 1.1rem;
      color: var(--text-white);
      margin-bottom: 4px;
    }

    .guest-info p {
      font-size: 0.85rem;
      color: #bfa8e0;
    }

    .btn-checkin {
      background: var(--success-green);
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 8px;
      border: none;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-checked-in {
      background: rgba(255, 255, 255, 0.15);
      color: #a0a0a0;
      padding: 10px 18px;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      cursor: not-allowed;
    }

    .status-toast {
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 8px;
      text-align: center;
      font-weight: 600;
      display: none;
    }

    .toast-success {
      background: rgba(46, 204, 113, 0.2);
      border: 1px solid #2ecc71;
      color: #2ecc71;
    }

    .toast-error {
      background: rgba(231, 76, 60, 0.2);
      border: 1px solid #e74c3c;
      color: #e74c3c;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>PLC Star Night '26</h1>
    <p>Check-In Dashboard & QR Scanner</p>
  </div>

  <div class="container">
    <div class="scanner-wrapper">
      <div id="reader"></div>
    </div>

    <div class="search-box">
      <input 
        type="text" 
        id="searchInput" 
        class="search-input" 
        placeholder="Search by Name, Invitee ID, or Emp No..." 
        onkeyup="if(event.key === 'Enter') executeSearch()"
      />
      <button class="btn" onclick="executeSearch()">Search</button>
    </div>

    <div id="statusToast" class="status-toast"></div>
    <div id="resultsList" class="results-container"></div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyI-rC7SHYa4X0820Nif9hCl4vFchTYw_hla6ocaqiUn3ca3jjACNROoAa-FQGiBkua/exec";
    let isProcessingScan = false;

    function showToast(message, isSuccess = true) {
      const toast = document.getElementById("statusToast");
      toast.className = "status-toast " + (isSuccess ? "toast-success" : "toast-error");
      toast.innerText = message;
      toast.style.display = "block";

      setTimeout(() => {
        toast.style.display = "none";
      }, 4000);
    }

    function executeSearch() {
      const query = document.getElementById("searchInput").value.trim();
      if (!query) return;

      const cb = 'cb_search_' + Date.now();
      const script = document.createElement('script');

      window[cb] = function(data) {
        delete window[cb];
        if (script.parentNode) script.parentNode.removeChild(script);

        const list = document.getElementById("resultsList");
        list.innerHTML = "";

        if (data.status === "success" && data.matches && data.matches.length > 0) {
          data.matches.forEach(guest => {
            const isAlreadyIn = guest.status.toLowerCase().includes("checked");
            const card = document.createElement("div");
            card.className = "guest-card";
            card.innerHTML = `
              <div class="guest-info">
                <h3>${guest.name}</h3>
                <p>ID: ${guest.inviteeId} | Emp No: ${guest.empNo}</p>
              </div>
              <button 
                class="${isAlreadyIn ? 'btn-checked-in' : 'btn-checkin'}" 
                ${isAlreadyIn ? 'disabled' : ''}
                onclick="manualCheckIn(${guest.rowIndex}, '${guest.name.replace(/'/g, "\\'")}')"
              >
                ${isAlreadyIn ? 'Checked In' : 'Check In'}
              </button>
            `;
            list.appendChild(card);
          });
        } else {
          showToast("No guests found matching: " + query, false);
        }
      };

      script.src = `${SCRIPT_URL}?mode=search&query=${encodeURIComponent(query)}&callback=${cb}&_=${Date.now()}`;
      document.body.appendChild(script);
    }

    function manualCheckIn(rowIndex, guestName) {
      const cb = 'cb_checkin_' + Date.now();
      const script = document.createElement('script');

      window[cb] = function(res) {
        delete window[cb];
        if (script.parentNode) script.parentNode.removeChild(script);

        if (res.status === "success") {
          showToast(`Successfully Checked In: ${guestName}`, true);
          executeSearch();
        } else {
          showToast("Check-in failed: " + res.message, false);
        }
      };

      script.src = `${SCRIPT_URL}?mode=checkin&id=${rowIndex}&callback=${cb}&_=${Date.now()}`;
      document.body.appendChild(script);
    }

    function handleCameraScan(qrText) {
      if (isProcessingScan) return;
      isProcessingScan = true;

      const cbSearch = 'cb_qr_' + Date.now();
      const scriptSearch = document.createElement('script');

      window[cbSearch] = function(data) {
        delete window[cbSearch];
        if (scriptSearch.parentNode) scriptSearch.parentNode.removeChild(scriptSearch);

        if (data.status === "success" && data.matches && data.matches.length > 0) {
          const guest = data.matches[0];
          manualCheckIn(guest.rowIndex, guest.name);
        } else {
          showToast("Invalid QR Code: " + qrText, false);
        }

        setTimeout(() => { isProcessingScan = false; }, 3000);
      };

      scriptSearch.src = `${SCRIPT_URL}?mode=search&query=${encodeURIComponent(qrText)}&callback=${cbSearch}&_=${Date.now()}`;
      document.body.appendChild(scriptSearch);
    }

    const html5QrcodeScanner = new Html5QrcodeScanner("reader", { 
      fps: 10, 
      qrbox: { width: 220, height: 220 },
      rememberLastUsedCamera: true,
      showTorchButtonIfSupported: true
    }, false);

    html5QrcodeScanner.render((decodedText) => {
      handleCameraScan(decodedText);
    }, () => {});
  </script>

</body>
</html>
