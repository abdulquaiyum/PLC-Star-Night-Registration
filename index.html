<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; margin: 0; padding: 20px; background: #1a0f3d; color: white; }
    #reader { width: 100%; max-width: 400px; margin: 0 auto; }
    #result { font-size: 24px; margin-top: 20px; padding: 20px; border-radius: 12px; min-height: 30px; }
    .ok { background: #1f9d55; }
    .dup { background: #b7791f; }
    .err { background: #c53030; }
  </style>
</head>
<body>
  <h2>PLC Star Night Check-In</h2>
  <div id="reader"></div>
  <div id="result"></div>

  <script>
    var BACKEND_URL = 'https://script.google.com/macros/s/AKfycbyI-rC7SHYa4X0820Nif9hCl4vFchTYw_hla6ocaqiUn3ca3jjACNROoAa-FQGiBkua/exec';

    var resultDiv = document.getElementById('result');
    var scanning = true;

    // JSONP request - avoids the browser's CORS block that a normal fetch() hits
    // when calling script.google.com from a different site (github.io).
    function jsonpRequest(url, onSuccess, onError) {
      var callbackName = 'jsonp_cb_' + Math.round(Math.random() * 1000000);
      var timeoutId;

      window[callbackName] = function(data) {
        cleanup();
        onSuccess(data);
      };

      function cleanup() {
        clearTimeout(timeoutId);
        delete window[callbackName];
        if (script.parentNode) script.parentNode.removeChild(script);
      }

      var script = document.createElement('script');
      script.src = url + (url.indexOf('?') >= 0 ? '&' : '?') + 'callback=' + callbackName;
      script.onerror = function() {
        cleanup();
        onError();
      };

      // safety timeout in case the request hangs silently
      timeoutId = setTimeout(function() {
        cleanup();
        onError();
      }, 8000);

      document.body.appendChild(script);
    }

    function onScanSuccess(decodedText) {
      if (!scanning) return;
      scanning = false;

      jsonpRequest(
        BACKEND_URL + '?id=' + encodeURIComponent(decodedText),
        function(data) {
          if (data.status === 'ok') {
            resultDiv.className = 'ok';
            resultDiv.innerText = 'Welcome, ' + data.name + '!';
          } else if (data.status === 'duplicate') {
            resultDiv.className = 'dup';
            resultDiv.innerText = data.name + ' already checked in';
          } else {
            resultDiv.className = 'err';
            resultDiv.innerText = 'ID not found: ' + decodedText;
          }
          setTimeout(function() { resultDiv.innerText = ''; scanning = true; }, 2500);
        },
        function() {
          resultDiv.className = 'err';
          resultDiv.innerText = 'Network error - try again';
          setTimeout(function() { resultDiv.innerText = ''; scanning = true; }, 2000);
        }
      );
    }

    var qr = new Html5Qrcode('reader');
    qr.start({ facingMode: 'environment' }, { fps: 10, qrbox: 250 }, onScanSuccess);
  </script>
</body>
</html>
