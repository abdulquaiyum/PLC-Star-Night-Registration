<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scanner & Check-In - PLC Star Night '26</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    :root {
      --bg-purple: linear-gradient(135deg, #1b022d 0%, #2e0854 50%, #120024 100%);
      --accent-gold: #f1c40f;
      --gold-gradient: linear-gradient(135deg, #ffe066 0%, #f1c40f 50%, #b38600 100%);
      --text-white: #ffffff;
      --card-purple: rgba(46, 8, 84, 0.6);
      --border-gold: rgba(241, 196, 15, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    body {
      background: var(--bg-purple);
      color: var(--text-white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 20px;
    }

    .container {
      max-width: 700px;
      width: 100%;
      background: var(--card-purple);
      border: 1.5px solid var(--border-gold);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(10px);
    }

    h2 {
      font-size: 1.8rem;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-align: center;
      margin-bottom: 20px;
    }

    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px 15px;
      border-radius: 10px;
      border: 1px solid var(--border-gold);
      background: rgba(18, 0, 36, 0.8);
      color: #fff;
      font-size: 1rem;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--accent-gold);
    }

    button {
      padding: 12px 20px;
      border-radius: 10px;
      border: none;
      background: var(--gold-gradient);
      color: #120024;
      font-weight: 700;
      cursor: pointer;
      font-size: 1rem;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    #reader {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border-gold);
      margin-bottom: 25px;
      background: #000;
    }

    .results-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 350px;
      overflow-y: auto;
    }

    .result-card {
      background: rgba(27, 2, 45, 0.8);
      border: 1px solid var(--border-gold);
      border-radius: 12px;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .guest-info h4 {
      font-size: 1.2rem;
      color: #fff;
      margin-bottom: 4px;
    }

    .guest-info p {
      font-size: 0.85rem;
      color: #d1b3ff;
    }

    .status-badge {
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      display: inline-block;
      margin-top: 5px;
    }

    .status-checked {
      background: rgba(46, 204, 113, 0.2);
      color: #2ecc71;
      border: 1px solid rgba(46, 204, 113, 0.4);
    }

    .status-pending {
      background: rgba(241, 196, 15, 0.2);
      color: #f1c40f;
      border: 1px solid rgba(241, 196, 15, 0.4);
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #d1b3ff;
      text-decoration: none;
      font-size: 0.9rem;
    }

    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>QR Scanner & Check-In</h2>

    <!-- Camera Viewfinder -->
    <div id="reader"></div>

    <!-- Manual Query Fallback -->
    <div class="search-box">
      <input type="text" id="queryInput" placeholder="Search by ID, Emp No, or Name..." onkeypress="handleKeyPress(event)">
      <button onclick="performSearch()">Search</button>
    </div>

    <!-- Result List -->
    <div id="resultsContainer" class="results-container"></div>

    <a href="index.html" class="back-link">&larr; Back to Portal</a>
  </div>

  <script>
    // Replace with your current deployed Google Apps Script Web App URL
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyI-rC7SHYa4X0820Nif9hCl4vFchTYw_hla6ocaqiUn3ca3jjACNROoAa-FQGiBkua/exec";

    let html5QrCode;

    function handleKeyPress(e) {
      if (e.key === 'Enter') {
        performSearch();
      }
    }

    // JSONP utility request loader to avoid CORS restrictions
    function callBackend(params, onSuccess) {
      const callbackName = 'cb_' + Math.floor(Math.random() * 1000000);
      const script = document.createElement('script');

      window[callbackName] = function(data) {
        delete window[callbackName];
        if (script.parentNode) script.parentNode.removeChild(script);
        if (onSuccess) onSuccess(data);
      };

      script.onerror = function() {
        delete window[callbackName];
        if (script.parentNode) script.parentNode.removeChild(script);
        alert("Server communication error.");
      };

      let queryStr = Object.keys(params).map(k => `${k}=${encodeURIComponent(params[k])}`).join('&');
      script.src = `${SCRIPT_URL}?${queryStr}&callback=${callbackName}&_=${Date.now()}`;
      document.body.appendChild(script);
    }

    function performSearch(queryOverride) {
      const query = queryOverride !== undefined ? queryOverride : document.getElementById('queryInput').value.trim();
      if (!query) return;

      const container = document.getElementById('resultsContainer');
      container.innerHTML = `<p style="text-align:center; color:#d1b3ff;">Searching...</p>`;

      callBackend({ mode: 'search', query: query }, function(data) {
        container.innerHTML = "";
        if (data.status === "success" && data.matches && data.matches.length > 0) {
          data.matches.forEach(match => {
            const isChecked = match.status.toLowerCase().includes("checked");
            const statusClass = isChecked ? "status-checked" : "status-pending";
            const statusText = isChecked ? "Checked In" : "Pending Check-In";
            
            const card = document.createElement('div');
            card.className = 'result-card';
            card.innerHTML = `
              <div class="guest-info">
                <h4>${match.name}</h4>
                <p>ID: ${match.inviteeId} | Emp No: ${match.empNo}</p>
                ${match.tokenNo ? `<p style="color:#f1c40f; margin-top:2px;">Token #: ${match.tokenNo}</p>` : ''}
                <span class="status-badge ${statusClass}">${statusText}</span>
              </div>
              <div>
                <button onclick="executeCheckIn(${match.rowIndex}, '${match.name.replace(/'/g, "\\'")}')">Check In</button>
              </div>
            `;
            container.appendChild(card);
          });
        } else {
          container.innerHTML = `<p style="text-align:center; color:#d1b3ff;">No matching guest found.</p>`;
        }
      });
    }

    // Check-in trigger with Voting Token prompt
    function executeCheckIn(rowIndex, guestName) {
      const tokenNo = prompt(`Enter Voting Token # Assigned for ${guestName}:`, "");
      if (tokenNo === null) return; // Cancelled

      callBackend({ mode: 'checkin', id: rowIndex, tokenNo: tokenNo }, function(data) {
        if (data.status === "success") {
          alert(`Successfully Checked In ${data.name}! Token #${tokenNo || "None"} assigned.`);
          // Refresh search view to show updated status
          performSearch(document.getElementById('queryInput').value.trim());
        } else {
          alert("Check-in failed: " + data.message);
        }
      });
    }

    // Initialize QR Code Scanner
    function onScanSuccess(decodedText, decodedResult) {
      // Pause scanner briefly on read or execute search directly using scanned text
      document.getElementById('queryInput').value = decodedText;
      performSearch(decodedText);
    }

    document.addEventListener("DOMContentLoaded", function () {
      html5QrCode = new Html5Qrcode("reader");
      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 250, height: 250 } },
        onScanSuccess
      ).catch(err => {
        console.warn("Camera start failed, falling back to manual search mode.", err);
      });
    });
  </script>

</body>
</html>
