<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Scanner - PLC Star Night '26</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    :root {
      --bg-purple: linear-gradient(135deg, #1b022d 0%, #2e0854 50%, #120024 100%);
      --accent-gold: #f1c40f;
      --text-white: #ffffff;
      --card-purple: rgba(46, 8, 84, 0.6);
      --border-gold: rgba(241, 196, 15, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    body {
      background: var(--bg-purple);
      color: var(--text-white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 1.8rem;
      color: var(--accent-gold);
    }

    .container {
      max-width: 500px;
      width: 100%;
      background: var(--card-purple);
      border: 1px solid var(--border-gold);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    #reader {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border-gold);
    }

    .status-card {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      display: none;
      text-align: center;
      font-weight: bold;
    }

    .success {
      background: rgba(46, 204, 113, 0.2);
      border: 1px solid #2ecc71;
      color: #2ecc71;
    }

    .error {
      background: rgba(231, 76, 60, 0.2);
      border: 1px solid #e74c3c;
      color: #e74c3c;
    }

    .info {
      background: rgba(52, 152, 219, 0.2);
      border: 1px solid #3498db;
      color: #3498db;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>PLC Star Night '26</h1>
    <p>QR Code Check-In Scanner</p>
  </div>

  <div class="container">
    <div id="reader"></div>
    <div id="statusCard" class="status-card"></div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyI-rC7SHYa4X0820Nif9hCl4vFchTYw_hla6ocaqiUn3ca3jjACNROoAa-FQGiBkua/exec";
    let isProcessing = false;

    function showStatus(message, type) {
      const card = document.getElementById("statusCard");
      card.className = "status-card " + type;
      card.innerText = message;
      card.style.display = "block";
    }

    function processScan(qrCodeValue) {
      if (isProcessing) return;
      isProcessing = true;

      showStatus("Searching for QR Code: " + qrCodeValue + "...", "info");

      // Search backend for row corresponding to QR code
      const cbSearch = 'cb_search_' + Date.now();
      const scriptSearch = document.createElement('script');

      window[cbSearch] = function(data) {
        delete window[cbSearch];
        if (scriptSearch.parentNode) scriptSearch.parentNode.removeChild(scriptSearch);

        if (data.status === "success" && data.matches && data.matches.length > 0) {
          const guest = data.matches[0];

          // Found row, submit check-in
          const cbCheckin = 'cb_checkin_' + Date.now();
          const scriptCheckin = document.createElement('script');

          window[cbCheckin] = function(res) {
            delete window[cbCheckin];
            if (scriptCheckin.parentNode) scriptCheckin.parentNode.removeChild(scriptCheckin);

            if (res.status === "success") {
              showStatus(`Checked In: ${res.name}`, "success");
            } else {
              showStatus("Check-in Error: " + res.message, "error");
            }

            setTimeout(() => {
              isProcessing = false;
              document.getElementById("statusCard").style.display = "none";
            }, 3000);
          };

          scriptCheckin.src = `${SCRIPT_URL}?mode=checkin&id=${guest.rowIndex}&callback=${cbCheckin}&_=${Date.now()}`;
          document.body.appendChild(scriptCheckin);

        } else {
          showStatus("Invitee not found in MasterSheet", "error");
          setTimeout(() => {
            isProcessing = false;
            document.getElementById("statusCard").style.display = "none";
          }, 3000);
        }
      };

      scriptSearch.src = `${SCRIPT_URL}?mode=search&query=${encodeURIComponent(qrCodeValue)}&callback=${cbSearch}&_=${Date.now()}`;
      document.body.appendChild(scriptSearch);
    }

    const html5QrcodeScanner = new Html5QrcodeScanner("reader", { 
      fps: 10, 
      qrbox: { width: 250, height: 250 } 
    });

    html5QrcodeScanner.render((decodedText) => {
      processScan(decodedText);
    }, (error) => {
      // Quiet scanner errors
    });
  </script>

</body>
</html>
